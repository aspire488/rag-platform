<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="title desc">
  <title id="title">rag-platform, the Retrieval Lab</title>
  <desc id="desc">The nine request stages that rag-platform's trace schema defines, in order: authn, authz_filter, cache_lookup, retrieval, post_verify, context_build, generation, ledger, response. None of them runs yet. Retrieval's stores are built but not wired; generation is off by default with no code yet; the rest are planned.</desc>
  <style>
    .bg{fill:#0d1418}.edge{fill:none;stroke:#26343b;stroke-width:2}.dot{fill:#1b272d}
    .ink{fill:#e7eff1}.muted{fill:#8fa3ab}.teal{fill:#3cc8c0}
    .mono{font-family:ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .rule{stroke:#26343b;stroke-width:1}
    .planned{fill:none;stroke:#7f949c;stroke-width:2;stroke-dasharray:4 3}
    .built{fill:#3cc8c0}.gap{stroke:#3cc8c0;stroke-width:2;stroke-linecap:round}
    .off{fill:none;stroke:#e2b45c;stroke-width:2}
  </style>
  <rect class="bg" x="1" y="1" width="718" height="468" rx="14"/>
  <rect class="edge" x="1" y="1" width="718" height="468" rx="14"/>
  <!-- faint dot field, top-right corner only: texture, not ruling -->
  <g class="dot">
    <circle cx="560" cy="40" r="1.6"/><circle cx="584" cy="40" r="1.6"/><circle cx="608" cy="40" r="1.6"/><circle cx="632" cy="40" r="1.6"/><circle cx="656" cy="40" r="1.6"/><circle cx="680" cy="40" r="1.6"/>
    <circle cx="584" cy="64" r="1.6"/><circle cx="608" cy="64" r="1.6"/><circle cx="632" cy="64" r="1.6"/><circle cx="656" cy="64" r="1.6"/><circle cx="680" cy="64" r="1.6"/>
    <circle cx="608" cy="88" r="1.6"/><circle cx="632" cy="88" r="1.6"/><circle cx="656" cy="88" r="1.6"/><circle cx="680" cy="88" r="1.6"/>
    <circle cx="632" cy="112" r="1.6"/><circle cx="656" cy="112" r="1.6"/><circle cx="680" cy="112" r="1.6"/>
  </g>

  <text class="ink mono" x="40" y="86" font-size="54" font-weight="700" letter-spacing="-2">rag-platform</text>
  <text class="muted sans" x="42" y="130" font-size="24">Local-first retrieval-augmented generation,</text>
  <text class="muted sans" x="42" y="162" font-size="24">assembled from the storage layer up.</text>

  <text class="teal mono" x="40" y="222" font-size="24">trace_stages</text>
  <text class="muted sans" x="680" y="222" font-size="24" text-anchor="end">the path a request will take</text>

  <!-- the nine stages in schema.sql order, read left to right, top to bottom -->
  <g class="mono ink" font-size="24">
    <circle class="planned" cx="52" cy="264" r="8"/><text x="72" y="272">authn</text>
    <circle class="planned" cx="268" cy="264" r="8"/><text x="288" y="272">authz_filter</text>
    <circle class="planned" cx="484" cy="264" r="8"/><text x="504" y="272">cache_lookup</text>
    <circle class="built" cx="52" cy="310" r="8"/><path class="gap" d="M64 310h8M80 310h8"/><text x="96" y="318">retrieval</text>
    <circle class="planned" cx="268" cy="310" r="8"/><text x="288" y="318">post_verify</text>
    <circle class="planned" cx="484" cy="310" r="8"/><text x="504" y="318">context_build</text>
    <circle class="off" cx="52" cy="356" r="8"/><path class="off" d="M46 362l12-12"/><text x="72" y="364">generation</text>
    <circle class="planned" cx="268" cy="356" r="8"/><text x="288" y="364">ledger</text>
    <circle class="planned" cx="484" cy="356" r="8"/><text x="504" y="364">response</text>
  </g>

  <!-- legend: the shape carries the status, colour only repeats it -->
  <path class="rule" d="M40 396H680"/>
  <g class="sans muted" font-size="22">
    <circle class="built" cx="52" cy="432" r="8"/><text x="70" y="439">built</text>
    <circle class="built" cx="158" cy="432" r="8"/><path class="gap" d="M170 432h8M186 432h8"/><text x="204" y="439">built, not wired</text>
    <circle class="planned" cx="392" cy="432" r="8"/><text x="410" y="439">planned</text>
    <circle class="off" cx="522" cy="432" r="8"/><path class="off" d="M516 438l12-12"/><text x="540" y="439">off by default</text>
  </g>
</svg>
